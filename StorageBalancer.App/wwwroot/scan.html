<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan activity | Pool Survey</title>
    <style>
        :root { color-scheme:light; --ink:#1b2724; --muted:#687772; --paper:#f4f5ef; --surface:#fffefa; --line:#d9dfd5; --green:#286b56; --deep:#1d4d3e; --orange:#b65b38; }
        * { box-sizing:border-box; }
        body { margin:0; color:var(--ink); background-color:var(--paper); background-image:radial-gradient(#cfd8cb .7px,transparent .7px); background-size:18px 18px; font-family:"Segoe UI Variable","Segoe UI",sans-serif; }
        button,input { font:inherit; }
        button { cursor:pointer; }
        .shell { width:min(1080px,calc(100% - 36px)); margin:0 auto; }
        header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0; border-bottom:1px solid var(--line); }
        .brand,.back { color:var(--ink); text-decoration:none; font-size:13px; font-weight:700; }
        .back { color:var(--green); }
        main { padding:33px 0 60px; }
        .topline { display:flex; align-items:center; justify-content:space-between; gap:16px; }
        .eyebrow { color:var(--green); font-size:11px; font-weight:800; text-transform:uppercase; }
        h1 { margin:6px 0 0; font-size:29px; }
        .state { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
        .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
        .setup { display:grid; grid-template-columns:minmax(220px,1fr) auto; align-items:end; gap:12px; margin:22px 0; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:7px; }
        .field { display:grid; gap:5px; }
        .field label { color:var(--muted); font-size:11px; font-weight:700; }
        .field input { width:100%; min-height:38px; padding:8px 10px; background:#fbfcf8; border:1px solid var(--line); border-radius:5px; outline:none; }
        .field input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgb(40 107 86 / 12%); }
        .button { min-height:38px; padding:0 14px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; font-size:13px; font-weight:650; }
        .button.primary { color:white; background:var(--green); border-color:var(--green); }
        .button.primary:hover { background:var(--deep); }
        .button.danger { color:var(--orange); }
        .button:disabled { opacity:.55; cursor:wait; }
        .snapshot { display:grid; gap:5px; margin:0 0 16px; padding:13px 15px; background:#e9eee3; border-radius:6px; }
        .snapshot-label { color:var(--muted); font-size:10px; font-weight:800; text-transform:uppercase; }
        .snapshot-name { font-size:14px; font-weight:750; overflow-wrap:anywhere; }
        .snapshot-path { color:var(--muted); font-family:Consolas,monospace; font-size:11px; overflow-wrap:anywhere; }
        .summary { display:flex; justify-content:space-between; gap:16px; margin:0 0 12px; color:var(--muted); font-size:12px; }
        .disks { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr)); gap:10px; }
        .disk { padding:16px 17px; background:var(--surface); border:1px solid var(--line); border-radius:7px; box-shadow:0 12px 30px rgb(27 39 36 / 7%); }
        .disk-head { display:flex; justify-content:space-between; align-items:start; gap:12px; }
        .disk-name { font-size:14px; font-weight:750; overflow-wrap:anywhere; }
        .disk-id { margin-top:3px; color:var(--muted); font-size:11px; }
        .pill { padding:4px 8px; color:var(--deep); background:#e7f0dd; border-radius:99px; font-size:10px; font-weight:800; text-transform:uppercase; }
        .pill.queued { color:#775829; background:#f4edda; }
        .pill.error { color:#923f2c; background:#f8e7df; }
        .path { min-height:34px; margin-top:15px; color:var(--muted); font-family:Consolas,monospace; font-size:11px; overflow-wrap:anywhere; }
        .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:13px; padding-top:12px; border-top:1px solid var(--line); }
        .value { font-size:17px; font-weight:730; font-variant-numeric:tabular-nums; }
        .label { margin-top:2px; color:var(--muted); font-size:10px; }
        .error { margin-top:10px; color:#a43f2a; font-size:11px; overflow-wrap:anywhere; }
        .empty { padding:22px; color:var(--muted); border:1px dashed #bfcabe; border-radius:7px; font-size:13px; }
        .message { min-height:20px; margin:12px 0; color:#a43f2a; font-size:12px; }
        @media(max-width:600px) { .shell{width:calc(100% - 26px)} .setup{grid-template-columns:1fr} .topline{align-items:flex-start} }
    </style>
</head>
<body>
    <header class="shell"><a class="brand" href="/">Pool Survey</a><a class="back" href="/">Back to overview</a></header>
    <main class="shell">
        <div class="topline"><div><div class="eyebrow">Pool scan</div><h1>Scan activity</h1></div><div class="state"><span class="dot" id="dot"></span><span id="state">Ready</span></div></div>
        <section class="setup">
            <div class="field"><label for="snapshot-name">Snapshot name</label><input id="snapshot-name" maxlength="120" placeholder="Blank uses the current date and time"></div>
            <div><button class="button primary" id="start" type="button">Start scan</button><button class="button danger" id="cancel" type="button" hidden>Cancel scan</button></div>
        </section>
        <div class="snapshot"><div class="snapshot-label">Snapshot destination</div><div class="snapshot-name" id="snapshot-value">Waiting for scan</div><div class="snapshot-path" id="snapshot-path"></div></div>
        <div class="summary"><span id="scan-summary">No scan activity</span><span id="scan-time"></span></div>
        <div class="message" id="message" role="status" aria-live="polite"></div>
        <section class="disks" id="disks"><div class="empty">No scan activity to show.</div></section>
    </main>
    <script>
        const params = new URLSearchParams(location.search);
        const nameInput = document.getElementById('snapshot-name');
        const startButton = document.getElementById('start');
        const cancelButton = document.getElementById('cancel');
        let polling = false;
        let starting = false;
        nameInput.value = params.get('name') || '';

        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[character]);
        const formatBytes = bytes => {
            if (!bytes) return '0 B';
            const units = ['B','KiB','MiB','GiB','TiB'];
            const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            return `${(bytes / (1024 ** index)).toFixed(index > 1 ? 1 : 0)} ${units[index]}`;
        };

        async function request(url, options) {
            const response = await fetch(url, options);
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `Request failed (${response.status}).`);
            return data;
        }

        function render(status) {
            const disks = status.disks || [];
            const running = status.isScanning;
            startButton.hidden = running;
            startButton.disabled = starting;
            cancelButton.hidden = !running;
            cancelButton.disabled = Boolean(status.isCancellationRequested);
            cancelButton.textContent = status.isCancellationRequested ? 'Cancelling...' : 'Cancel scan';
            nameInput.disabled = running;
            document.getElementById('state').textContent = status.error ? 'Failed' : (status.isCancellationRequested ? 'Cancelling' : (running ? 'Scanning' : 'Ready'));
            document.getElementById('dot').style.background = status.error || running ? '#b65b38' : '#286b56';
            document.getElementById('scan-summary').textContent = status.error || (running ? 'Scanning configured physical disks' : (status.scannedAt ? 'Scan finished' : 'No scan activity'));
            document.getElementById('scan-time').textContent = status.scannedAt ? new Date(status.scannedAt).toLocaleString() : '';
            document.getElementById('snapshot-value').textContent = status.snapshotName || 'Waiting for scan';
            document.getElementById('snapshot-path').textContent = status.snapshotPath || '';

            if (!disks.length) {
                document.getElementById('disks').innerHTML = '<div class="empty">No scan activity to show.</div>';
                return;
            }

            document.getElementById('disks').innerHTML = disks.map(disk => {
                const hasError = Boolean(disk.error);
                const stateClass = hasError || disk.status === 'Failed' ? 'error' : (disk.status === 'Queued' ? 'queued' : '');
                return `<article class="disk"><div class="disk-head"><div><div class="disk-name">${escapeHtml(disk.hardwareName)}</div><div class="disk-id">${escapeHtml(disk.id)}</div></div><span class="pill ${stateClass}">${escapeHtml(disk.status)}</span></div>
                    <div class="path">${escapeHtml(disk.currentPath || (disk.status === 'Complete' ? 'Scan complete' : 'Waiting to scan'))}</div>
                    <div class="metrics"><div><div class="value">${Number(disk.filesScanned).toLocaleString()}</div><div class="label">Files</div></div><div><div class="value">${Number(disk.foldersScanned).toLocaleString()}</div><div class="label">Folders</div></div><div><div class="value">${formatBytes(Number(disk.bytesScanned))}</div><div class="label">Logical data</div></div></div>
                    ${hasError ? `<div class="error">${escapeHtml(disk.error)}</div>` : ''}</article>`;
            }).join('');
        }

        async function poll() {
            try {
                const status = await request('/api/scan/status');
                render(status);
                if (status.isScanning) setTimeout(poll, 800);
                else polling = false;
            } catch (error) {
                document.getElementById('message').textContent = error.message;
                polling = false;
            }
        }

        function beginPolling() {
            if (polling) return;
            polling = true;
            poll();
        }

        async function startScan() {
            starting = true;
            startButton.disabled = true;
            document.getElementById('message').textContent = '';
            try {
                await request('/api/scan', {
                    method:'POST',
                    headers:{ 'Content-Type':'application/json' },
                    body:JSON.stringify({ snapshotName:nameInput.value.trim() })
                });
                beginPolling();
            } catch (error) {
                document.getElementById('message').textContent = error.message;
                const status = await request('/api/scan/status').catch(() => null);
                if (status?.isScanning) {
                    render(status);
                    beginPolling();
                }
            } finally {
                starting = false;
                if (!cancelButton.hidden) startButton.disabled = true;
                else startButton.disabled = false;
            }
        }

        async function cancelScan() {
            cancelButton.disabled = true;
            try { render(await request('/api/scan/cancel', { method:'POST' })); beginPolling(); }
            catch (error) { document.getElementById('message').textContent = error.message; cancelButton.disabled = false; }
        }

        startButton.addEventListener('click', startScan);
        cancelButton.addEventListener('click', cancelScan);
        if (params.get('start') === '1') startScan();
        else beginPolling();
    </script>
</body>
</html>
