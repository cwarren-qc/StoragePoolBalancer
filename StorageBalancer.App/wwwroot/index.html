<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Storage Pool Balancer</title>
    <link rel="stylesheet" href="/shared.css">
    <style>
        .hero-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .hero-title p {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }
        .hero-actions {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .step-container {
            margin-bottom: 20px;
        }
        .step-placeholder {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header class="shell">
        <a href="/" class="brand">
            <span class="brand-icon">S</span>
            Storage Pool Balancer
        </a>
    </header>

    <main class="shell">
        <!-- Top Action & Title Area -->
        <div class="hero-bar">
            <div class="hero-title">
                <p>Run automated end-to-end pool balancing: Scan volumes, plan placements, and execute the balancing plan.</p>
            </div>
            <div class="hero-actions">
                <div style="display:flex; align-items:center; gap:6px;">
                    <label for="test-max-files" style="font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap;" title="Temporary test limit: throw an exception after copying this number of files">Number of files to copy:</label>
                    <input type="number" id="test-max-files" min="1" placeholder="All" style="width:70px; padding:6px 8px; border:1px solid var(--line); border-radius:5px; background:var(--surface); font-size:13px;" title="Test option: limits how many files are copied before throwing an exception">
                </div>
                <a href="/configuration.html" class="btn" title="Open and edit pool volumes, paths, and placement rules">
                    ⚙️ Edit Configuration
                </a>
                <button class="btn danger" id="btn-cancel-process" style="display:none;" title="Cancel running process">
                    Cancel Process
                </button>
                <button class="btn primary btn-large" id="btn-start-process" title="Start scanning, planning, and executing file balancing">
                    ▶ Start Process
                </button>
            </div>
        </div>

        <!-- 3-Step Pipeline Indicator -->
        <div class="stepper">
            <div class="step-card" id="step-card-1">
                <div class="step-num" id="step-badge-1">1</div>
                <div class="step-info">
                    <div class="step-title">State Scan</div>
                    <div class="step-desc" id="step-desc-1">Ready</div>
                </div>
            </div>
            <div class="step-card" id="step-card-2">
                <div class="step-num" id="step-badge-2">2</div>
                <div class="step-info">
                    <div class="step-title">Placement Planning</div>
                    <div class="step-desc" id="step-desc-2">Waiting</div>
                </div>
            </div>
            <div class="step-card" id="step-card-3">
                <div class="step-num" id="step-badge-3">3</div>
                <div class="step-info">
                    <div class="step-title">Plan Execution</div>
                    <div class="step-desc" id="step-desc-3">Waiting</div>
                </div>
            </div>
        </div>

        <div id="main-notice" class="notice"></div>

        <!-- PIPELINE PROCESS SECTIONS -->
        <div id="section-scan"></div>
        <div id="section-plan"></div>
        <div id="section-exec"></div>
    </main>

    <script src="/shared-scanner.js"></script>
    <script src="/shared-planner.js"></script>
    <script src="/shared-executer.js"></script>
    <script>
        Balancer.scanner.renderSection('section-scan', {
            titleText: '🔍 Step 1: State Scan',
            subtitleText: 'Not started',
            containerClass: 'step-container',
            open: false,
            placeholderClass: 'step-placeholder',
            placeholderText: "Click 'Start Process' to begin scanning pool volumes."
        });

        Balancer.plan.renderSection('section-plan', {
            titleText: '📊 Step 2: Placement Planning',
            subtitleText: 'Waiting for scan',
            containerClass: 'step-container',
            open: false,
            placeholderClass: 'step-placeholder',
            placeholderText: 'Placement preview will generate automatically after the scan completes.'
        });

        Balancer.execution.renderSection('section-exec', {
            titleText: '⚡ Step 3: Plan Execution',
            subtitleText: 'Waiting for plan',
            containerClass: 'step-container',
            open: false,
            placeholderClass: 'step-placeholder',
            placeholderText: 'Execution will begin automatically after the placement plan is generated.'
        });

        const btnStart = document.getElementById('btn-start-process');
        const btnCancel = document.getElementById('btn-cancel-process');
        const snapshotSelect = document.getElementById('snapshot-select');
        const scanTbody = document.getElementById('scan-tbody');
        const scanSubtitle = document.getElementById('scan-subtitle');
        const planSubtitle = document.getElementById('plan-subtitle');
        const planResults = document.getElementById('plan-results');
        const execSubtitle = document.getElementById('exec-subtitle');
        const execTbody = document.getElementById('exec-tbody');
        const execSummaryBar = document.getElementById('exec-summary-bar');
        const execPct = document.getElementById('exec-pct');
        const execTransferred = document.getElementById('exec-transferred');
        const execFiles = document.getElementById('exec-files');
        const execSpeed = document.getElementById('exec-speed');
        const execDuration = document.getElementById('exec-duration');
        const execFoldersCleaned = document.getElementById('exec-folders-cleaned');
        const execProgressFill = document.getElementById('exec-progress-fill');
        const mainNotice = document.getElementById('main-notice');

        let appState = {
            config: null,
            isRunning: false,
            isCancelling: false,
            currentStep: 0,
            pollTimer: null,
            planRendered: false,
            volumeColors: null
        };

        const detailsState = {
            step1Started: false,
            step2Started: false,
            step3Started: false
        };

        let programmaticUpdating = false;

        function setDetailsOpen(id, isOpen) {
            const el = document.getElementById(id);
            if (!el || el.open === isOpen) return;
            programmaticUpdating = true;
            try {
                el.open = isOpen;
            } finally {
                setTimeout(() => { programmaticUpdating = false; }, 50);
            }
        }

        // Global capture listener: saves user clicks on ANY <details> summary anywhere on the page
        document.addEventListener('toggle', (e) => {
            if (e.isTrusted && !programmaticUpdating && e.target && e.target.id) {
                window.Balancer.saveDetailsPref(e.target.id, e.target.open);
            }
        }, true);

        function applySavedDetailsPreferences() {
            ['details-scan', 'scan-details-volumes', 'details-plan', 'plan-details-volumes', 'details-exec'].forEach(id => {
                const pref = window.Balancer.getDetailsPref(id);
                if (pref !== null) {
                    setDetailsOpen(id, pref);
                }
            });
        }

        function showNotice(msg, type = 'info') {
            mainNotice.textContent = msg;
            mainNotice.className = `notice ${type}`;
        }

        function clearNotice() {
            mainNotice.textContent = '';
            mainNotice.className = 'notice';
        }

        function setStepState(stepNum, status, descText) {
            const card = document.getElementById(`step-card-${stepNum}`);
            const badge = document.getElementById(`step-badge-${stepNum}`);
            const desc = document.getElementById(`step-desc-${stepNum}`);

            card.classList.remove('active', 'completed');
            if (descText) desc.textContent = descText;

            if (status === 'active') {
                card.classList.add('active');
                badge.innerHTML = `<span class="spinner" style="width:12px; height:12px;"></span>`;
            } else if (status === 'completed') {
                card.classList.add('completed');
                badge.innerHTML = '✓';
            } else {
                badge.textContent = stepNum;
            }
        }

        async function initPage() {
            applySavedDetailsPreferences();

            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    appState.config = await res.json();
                }
            } catch (e) {
                console.error('Failed to load config:', e);
            }

            try {
                const res = await fetch('/api/process/status');
                if (res.ok) {
                    const status = await res.json();

                    if (status.isRunning) {
                        appState.isRunning = true;
                        btnStart.disabled = true;
                        btnStart.style.display = 'none';
                        btnCancel.style.display = 'inline-flex';
                        btnCancel.disabled = status.isCancellationRequested;
                        btnCancel.textContent = status.isCancellationRequested ? 'Cancelling...' : 'Cancel Process';
                        const maxFilesInput = document.getElementById('test-max-files');
                        if (maxFilesInput) {
                            if (status.maxFilesToCopy) maxFilesInput.value = status.maxFilesToCopy;
                            maxFilesInput.disabled = true;
                        }

                        renderProcessStatus(status);
                        pollProcessStatus();
                        return;
                    }

                    // Not running right now, but might have finished previously
                    if (status.phase === 'Completed' || status.phase === 'Cancelled' || status.phase === 'Failed') {
                        renderProcessStatus(status);
                        handleProcessFinished(status);
                        return;
                    }

                    // Idle state: If a scan was previously completed, render it
                    if (status.scanStatus && !status.scanStatus.isScanning && status.scanStatus.scannedAt) {
                        if (scanSubtitle) {
                            scanSubtitle.textContent = `Scan finished at ${new Date(status.scanStatus.scannedAt).toLocaleTimeString()}`;
                        }
                        Balancer.scan.renderTable(status.scanStatus, scanTbody, appState.config?.volumes);
                        const scanPref = window.Balancer.getDetailsPref('details-scan');
                        const volPref = window.Balancer.getDetailsPref('scan-details-volumes');
                        setDetailsOpen('details-scan', scanPref !== null ? scanPref : true);
                        setDetailsOpen('scan-details-volumes', volPref !== null ? volPref : false);
                    }
                }
            } catch (e) {
                console.error('Failed to load process status:', e);
            }
        }

        async function startProcess() {
            if (appState.isRunning) return;
            clearNotice();

            const maxFilesInput = document.getElementById('test-max-files');
            const maxFiles = maxFilesInput && maxFilesInput.value ? parseInt(maxFilesInput.value, 10) : null;

            btnStart.disabled = true;
            btnStart.style.display = 'none';
            btnCancel.style.display = 'inline-flex';
            btnCancel.disabled = false;
            btnCancel.textContent = 'Cancel Process';
            if (maxFilesInput) maxFilesInput.disabled = true;

            // Reset transitions and preferences for a fresh start
            localStorage.removeItem('balancer_step1_transition_applied');
            localStorage.removeItem('balancer_step2_transition_applied');
            window.Balancer.saveDetailsPref('details-scan', true);
            window.Balancer.saveDetailsPref('scan-details-volumes', true);
            window.Balancer.saveDetailsPref('details-plan', false);
            window.Balancer.saveDetailsPref('plan-details-volumes', false);
            window.Balancer.saveDetailsPref('details-exec', false);

            detailsState.step1Started = true;
            detailsState.step2Started = false;
            detailsState.step3Started = false;

            setStepState(1, 'active', 'Scanning...');
            setStepState(2, 'pending', 'Waiting for scan');
            setStepState(3, 'pending', 'Waiting for plan');
            if (scanSubtitle) scanSubtitle.textContent = 'Scanning volumes in progress...';

            setDetailsOpen('details-scan', true);
            setDetailsOpen('scan-details-volumes', true);
            setDetailsOpen('details-plan', false);
            setDetailsOpen('details-exec', false);

            try {
                const res = await fetch('/api/process/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maxFilesToCopy: maxFiles })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.Error || err.error || 'Failed to start process');
                }

                appState.isRunning = true;
                appState.planRendered = false;
                pollProcessStatus();
            } catch (err) {
                showNotice(err.message || 'Failed to start process', 'error');
                stopProcessUI();
            }
        }

        async function cancelCurrentProcess() {
            if (!appState.isRunning || appState.isCancelling) return;
            appState.isCancelling = true;
            btnCancel.disabled = true;
            btnCancel.textContent = 'Cancelling...';

            showNotice('Cancelling process...', 'info');
            try {
                await fetch('/api/process/cancel', { method: 'POST' });
            } catch (e) {
                console.error('Cancel process error:', e);
            }
        }

        async function pollProcessStatus() {
            try {
                const res = await fetch('/api/process/status');
                if (!res.ok) {
                    appState.pollTimer = setTimeout(pollProcessStatus, 800);
                    return;
                }
                const status = await res.json();
                renderProcessStatus(status);

                if (status.isRunning) {
                    appState.pollTimer = setTimeout(pollProcessStatus, 800);
                } else {
                    handleProcessFinished(status);
                }
            } catch (err) {
                console.error('Error polling process status:', err);
                appState.pollTimer = setTimeout(pollProcessStatus, 1200);
            }
        }

        function renderProcessStatus(status) {
            if (status.isCancellationRequested) {
                btnCancel.disabled = true;
                btnCancel.textContent = 'Cancelling...';
            }

            // Step 1: Scan status
            if (status.scanStatus) {
                Balancer.scan.renderTable(status.scanStatus, scanTbody, appState.config?.volumes);
            }

            if (status.currentStep === 1) {
                setStepState(1, 'active', status.isCancellationRequested ? 'Cancelling...' : 'Scanning...');
                setStepState(2, 'pending', 'Waiting for scan');
                setStepState(3, 'pending', 'Waiting for plan');

                if (scanSubtitle) scanSubtitle.textContent = status.isCancellationRequested ? 'Cancelling scan...' : 'Scanning volumes in progress...';

                // Initial open when step 1 starts, respecting user preference if already saved
                if (!detailsState.step1Started) {
                    detailsState.step1Started = true;
                    const scanPref = window.Balancer.getDetailsPref('details-scan');
                    setDetailsOpen('details-scan', scanPref !== null ? scanPref : true);
                    const volPref = window.Balancer.getDetailsPref('scan-details-volumes');
                    setDetailsOpen('scan-details-volumes', volPref !== null ? volPref : true);
                }
            } else if (status.currentStep >= 2) {
                setStepState(1, 'completed', 'Completed');
                if (scanSubtitle && (!scanSubtitle.textContent || scanSubtitle.textContent === 'Not started' || scanSubtitle.textContent.startsWith('Scanning'))) {
                    scanSubtitle.textContent = (status.scanStatus && status.scanStatus.scannedAt)
                        ? `Scan finished at ${new Date(status.scanStatus.scannedAt).toLocaleTimeString()}`
                        : 'Completed';
                }

                // One-time transition when Step 1 finishes:
                // Force "State Scan" uncollapsed and "Volumes" under it collapsed. NEVER TOUCH that section again.
                if (!localStorage.getItem('balancer_step1_transition_applied')) {
                    localStorage.setItem('balancer_step1_transition_applied', 'true');
                    setDetailsOpen('details-scan', true);
                    setDetailsOpen('scan-details-volumes', false);
                    window.Balancer.saveDetailsPref('details-scan', true);
                    window.Balancer.saveDetailsPref('scan-details-volumes', false);
                }
            }

            // Step 2: Planning status
            if (status.currentStep === 2) {
                setStepState(2, 'active', status.isCancellationRequested ? 'Cancelling...' : 'Simulating...');
                setStepState(3, 'pending', 'Waiting for plan');

                if (planSubtitle && !planSubtitle.textContent.startsWith('Generated:')) {
                    planSubtitle.textContent = 'Simulating placement rules...';
                }
                if (!planResults.querySelector('.spinner')) {
                    planResults.innerHTML = '<div style="padding:20px; text-align:center;"><span class="spinner"></span> Simulating placement rules and file balancing...</div>';
                }

                if (!detailsState.step2Started) {
                    detailsState.step2Started = true;
                    const planPref = window.Balancer.getDetailsPref('details-plan');
                    setDetailsOpen('details-plan', planPref !== null ? planPref : true);
                }
            } else if (status.currentStep >= 3 || (status.hasPlan && !status.isRunning)) {
                setStepState(2, 'completed', 'Completed');
                if (!appState.planRendered && status.hasPlan) {
                    appState.planRendered = true;
                    loadAndRenderPlan();
                }

                // One-time transition when Step 2 finishes:
                // Force "Placement Planning" uncollapsed and "Volume Utilization" under it collapsed. NEVER TOUCH that section again.
                if (!localStorage.getItem('balancer_step2_transition_applied')) {
                    localStorage.setItem('balancer_step2_transition_applied', 'true');
                    setDetailsOpen('details-plan', true);
                    setDetailsOpen('plan-details-volumes', false);
                    window.Balancer.saveDetailsPref('details-plan', true);
                    window.Balancer.saveDetailsPref('plan-details-volumes', false);
                }
            }

            // Step 3: Execution status
            if (status.currentStep === 3) {
                setStepState(3, 'active', status.isCancellationRequested ? 'Cancelling...' : 'Transferring...');

                if (!detailsState.step3Started) {
                    detailsState.step3Started = true;
                    const execPref = window.Balancer.getDetailsPref('details-exec');
                    setDetailsOpen('details-exec', execPref !== null ? execPref : true);
                }

                if (execSubtitle) execSubtitle.textContent = status.isCancellationRequested
                    ? 'Cancelling execution... Stopping active transfers...'
                    : 'Executing file balancing plan...';
                execSummaryBar.style.display = 'flex';

                if (status.executionStatus) {
                    const activeColors = appState.volumeColors || Balancer.getVolumeColorMap(status.executionStatus.volumes || appState.config?.volumes || []);
                    appState.volumeColors = activeColors;

                    Balancer.execution.renderStatusSummary(status.executionStatus, {
                        subtitle: execSubtitle,
                        pct: execPct,
                        duration: execDuration,
                        progressFill: execProgressFill,
                        transferred: execTransferred,
                        files: execFiles,
                        speed: execSpeed,
                        foldersCleaned: execFoldersCleaned,
                        summaryBar: execSummaryBar,
                        notice: mainNotice
                    });
                    Balancer.execution.renderTable(status.executionStatus, execTbody, activeColors);
                }
            }
        }

        async function loadAndRenderPlan() {
            try {
                const res = await fetch('/api/process/plan');
                if (res.ok) {
                    const plan = await res.json();
                    Balancer.plan.renderPlan(plan, planResults, { sectionsOpenByDefault: false });
                    if (planSubtitle) planSubtitle.textContent = `Generated: ${new Date(plan.snapshotScannedAt || Date.now()).toLocaleTimeString()}`;
                }
            } catch (err) {
                console.error('Failed to load plan:', err);
            }
        }

        function handleProcessFinished(status) {
            stopProcessUI();

            if (status.scanStatus) {
                Balancer.scan.renderTable(status.scanStatus, scanTbody, appState.config?.volumes);
            }

            if (status.hasPlan && !appState.planRendered) {
                appState.planRendered = true;
                loadAndRenderPlan();
            }

            if (status.executionStatus) {
                const activeColors = appState.volumeColors || Balancer.getVolumeColorMap(status.executionStatus.volumes || appState.config?.volumes || []);
                appState.volumeColors = activeColors;

                Balancer.execution.renderStatusSummary(status.executionStatus, {
                    subtitle: execSubtitle,
                    pct: execPct,
                    duration: execDuration,
                    progressFill: execProgressFill,
                    transferred: execTransferred,
                    files: execFiles,
                    speed: execSpeed,
                    foldersCleaned: execFoldersCleaned,
                    summaryBar: execSummaryBar,
                    notice: mainNotice
                });
                Balancer.execution.renderTable(status.executionStatus, execTbody, activeColors);
            }

            if (status.phase === 'Completed') {
                setStepState(1, 'completed', 'Completed');
                setStepState(2, 'completed', 'Completed');
                setStepState(3, 'completed', 'Completed');
                if (execSubtitle) execSubtitle.textContent = 'Finished';
                showNotice('Process completed successfully! File balancing and empty folder cleanup executed.', 'success');
            } else if (status.phase === 'Cancelled') {
                if (status.currentStep === 1) setStepState(1, 'pending', 'Cancelled');
                if (status.currentStep >= 2) setStepState(1, 'completed', 'Completed');
                if (status.currentStep === 2) setStepState(2, 'pending', 'Cancelled');
                if (status.currentStep >= 3) setStepState(2, 'completed', 'Completed');
                if (status.currentStep === 3) setStepState(3, 'pending', 'Cancelled');

                if (status.currentStep === 1 && scanSubtitle) scanSubtitle.textContent = 'Scan cancelled by user';
                if (status.currentStep === 3 && execSubtitle) execSubtitle.textContent = 'Execution cancelled by user';

                showNotice('Process was cancelled by the user.', 'info');
            } else if (status.phase === 'Failed') {
                if (status.currentStep === 1) setStepState(1, 'pending', 'Failed');
                if (status.currentStep === 2) setStepState(2, 'pending', 'Failed');
                if (status.currentStep === 3) setStepState(3, 'pending', 'Failed');

                showNotice(status.error || 'Process stopped with error.', 'error');
            }
        }

        function stopProcessUI() {
            appState.isRunning = false;
            appState.isCancelling = false;
            if (appState.pollTimer) clearTimeout(appState.pollTimer);
            btnStart.disabled = false;
            btnStart.style.display = 'inline-flex';
            btnCancel.style.display = 'none';
            btnCancel.disabled = false;
            btnCancel.textContent = 'Cancel Process';
            const maxFilesInput = document.getElementById('test-max-files');
            if (maxFilesInput) maxFilesInput.disabled = false;
        }

        btnStart.addEventListener('click', startProcess);
        btnCancel.addEventListener('click', cancelCurrentProcess);

        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
