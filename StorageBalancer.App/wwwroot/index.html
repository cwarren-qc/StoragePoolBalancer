<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pool Survey</title>
    <style>
        :root { color-scheme:light; --ink:#1b2724; --muted:#687772; --paper:#f4f5ef; --surface:#fffefa; --line:#d9dfd5; --green:#286b56; --deep:#1d4d3e; --orange:#b65b38; }
        * { box-sizing:border-box; }
        body { margin:0; color:var(--ink); background-color:var(--paper); background-image:radial-gradient(#cfd8cb .7px,transparent .7px); background-size:18px 18px; font-family:"Segoe UI Variable","Segoe UI",sans-serif; }
        button,input { font:inherit; }
        button { cursor:pointer; }
        .shell { width:min(980px,calc(100% - 38px)); margin:0 auto; }
        header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:21px 0; border-bottom:1px solid var(--line); }
        .brand { display:flex; align-items:center; gap:11px; color:var(--ink); font-size:14px; font-weight:750; text-decoration:none; }
        .mark { display:grid; width:35px; height:35px; place-items:center; color:white; background:var(--green); border-radius:8px; }
        main { padding:43px 0 70px; }
        .eyebrow { color:var(--green); font-size:11px; font-weight:800; text-transform:uppercase; }
        h1 { margin:7px 0 0; font-size:31px; line-height:1.15; }
        .page-top { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:28px; }
        .last-scan { color:var(--muted); font-size:12px; text-align:right; }
        .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
        .stat { padding:18px 18px 17px 0; }
        .stat + .stat { padding-left:18px; border-left:1px solid var(--line); }
        .stat-value { font-size:23px; font-weight:740; font-variant-numeric:tabular-nums; }
        .stat-label { margin-top:4px; color:var(--muted); font-size:11px; }
        .details { display:grid; grid-template-columns:150px minmax(0,1fr); gap:12px 20px; padding:20px 0; border-bottom:1px solid var(--line); font-size:13px; }
        .detail-label { color:var(--muted); }
        .detail-value { overflow-wrap:anywhere; }
        .config-action { display:flex; justify-content:flex-end; margin-top:14px; }
        .disk-names { display:flex; flex-wrap:wrap; gap:7px; }
        .disk-name { padding:5px 8px; background:#e6ebe2; border-radius:4px; font-size:11px; font-weight:650; }
        .activity { display:flex; align-items:center; gap:9px; color:var(--green); font-weight:650; }
        .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
        .scan { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:14px; margin-top:30px; padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:7px; box-shadow:0 12px 30px rgb(27 39 36 / 6%); }
        .field { display:grid; gap:6px; }
        .field label { color:var(--muted); font-size:11px; font-weight:700; }
        .field input { width:100%; min-height:39px; padding:8px 10px; background:#fbfcf8; border:1px solid var(--line); border-radius:5px; outline:none; }
        .field input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgb(40 107 86 / 12%); }
        .button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:39px; padding:0 15px; color:white; background:var(--green); border:1px solid var(--green); border-radius:6px; font-size:13px; font-weight:700; text-decoration:none; }
        .button:hover { background:var(--deep); }
        .button:disabled { cursor:wait; opacity:.6; }
        .notice { min-height:20px; margin-top:10px; color:var(--muted); font-size:12px; }
        .notice.error { color:#a43f2a; }
        .planning { margin-top:34px; padding-top:21px; border-top:1px solid var(--line); }
        .planning-head { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:13px; }
        h2 { margin:0; font-size:18px; }
        .planning-note { margin-top:4px; color:var(--muted); font-size:12px; }
        .plan-controls { display:grid; grid-template-columns:minmax(220px,1fr) auto; gap:10px; align-items:end; padding:15px; background:var(--surface); border:1px solid var(--line); border-radius:7px; }
        select { width:100%; min-height:39px; padding:7px 10px; color:var(--ink); background:#fbfcf8; border:1px solid var(--line); border-radius:5px; font:inherit; }
        select:focus { outline:2px solid rgb(40 107 86 / 25%); border-color:var(--green); }
        .plan-results { margin-top:16px; }
        .plan-counts { display:flex; flex-wrap:wrap; gap:22px; padding:13px 0; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
        .plan-counts strong { color:var(--ink); font-size:15px; }
        .plan-warning { margin:9px 0; padding:9px 11px; color:#775829; background:#f4edda; border-radius:5px; font-size:12px; overflow-wrap:anywhere; }
        .plan-group { border-bottom:1px solid var(--line); }
        .plan-group summary { padding:13px 0; cursor:pointer; font-size:13px; font-weight:700; }
        .table-scroll { overflow:auto; margin:0 0 14px; }
        .plan-table { width:100%; border-collapse:collapse; font-size:12px; }
        .plan-table th,.plan-table td { padding:8px 12px; border-top:1px solid var(--line); text-align:left; vertical-align:top; }
        .plan-table th { color:var(--muted); font-size:10px; font-weight:750; text-transform:uppercase; white-space:nowrap; user-select:none; }
        .plan-table th:hover { color:var(--ink); }
        th[title], .stat[title], label[title], .reason-badge[title] { cursor: help; }
        th[data-sort][title] { cursor: pointer; }
        .plan-table td { overflow-wrap:anywhere; }
        .plan-table th:first-child, .plan-table td:first-child { white-space:nowrap; width:45px; text-align:center; }
        .plan-path { min-width:180px; font-family:Consolas,monospace; }
        .plan-muted { color:var(--muted); }
        .reason-badge { display:inline-block; padding:3px 6px; background:#e9eee3; color:var(--deep); border-radius:4px; font-size:10px; font-weight:700; white-space:nowrap; }
        .target-col { display:flex; align-items:center; gap:6px; white-space:nowrap; }
        .transfer-swatch { width:9px; height:9px; flex:none; background:var(--source-color); border-radius:2px; display:inline-block; }
        .volume-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr)); gap:10px; margin-top:15px; }
        .volume-card { min-width:0; padding:0; overflow:hidden; color:var(--ink); text-align:left; background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--volume-color); border-radius:7px; }
        .volume-card-head { display:flex; justify-content:space-between; gap:12px; padding:12px 13px 8px; background:color-mix(in srgb,var(--volume-color) 11%,var(--surface)); border-bottom:1px solid color-mix(in srgb,var(--volume-color) 22%,var(--line)); }
        .volume-alias { font-size:14px; font-weight:750; }
        .volume-size { text-align:right; white-space:nowrap; font-size:12px; font-variant-numeric:tabular-nums; }
        .provenance-bar { display:flex; height:19px; margin:6px 13px 8px; overflow:hidden; background:#e4e8e1; border-radius:3px; }
        .provenance-segment { min-width:1px; height:100%; }
        .provenance-legend { display:flex; flex-wrap:wrap; gap:5px 11px; padding:0 13px 11px; }
        .provenance-key { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:10px; }
        .volume-state { padding:0 13px 11px; color:var(--orange); font-size:11px; }
        @media(max-width:650px) { .shell{width:calc(100% - 26px)} main{padding-top:29px} .page-top{align-items:flex-start} .summary{grid-template-columns:repeat(3,minmax(0,1fr))} .stat{padding-right:8px} .stat + .stat{padding-left:10px} .stat-value{font-size:20px} .details{grid-template-columns:115px minmax(0,1fr)} .scan{grid-template-columns:1fr} .scan .button{width:100%} }
    </style>
</head>
<body>
    <header class="shell">
        <a class="brand" href="/"><span class="mark" aria-hidden="true">P</span><span>Pool Survey</span></a>
    </header>
    <main class="shell">
        <div class="page-top">
            <div><div class="eyebrow">Pool overview</div><h1>Storage summary</h1></div>
            <div class="last-scan" id="last-scan">Loading pool state</div>
        </div>
        <section class="summary" aria-label="Configuration summary">
            <div class="stat" title="Number of physical storage hard drives detected in the pool"><div class="stat-value" id="disk-count">-</div><div class="stat-label">Physical disks</div></div>
            <div class="stat" title="Total number of mounted volumes across configured disks"><div class="stat-value" id="volume-count">-</div><div class="stat-label">Mounted volumes</div></div>
            <div class="stat" title="DrivePool mode determines Root Folder automatically (PoolPart.*, and it's not hidden); Standard mode scans configured volume roots"><div class="stat-value" id="pool-mode">-</div><div class="stat-label">Pool mode</div></div>
        </section>
        <section class="details">
            <div class="detail-label">Configured disks</div><div class="detail-value disk-names" id="disk-names">Loading...</div>
            <div class="detail-label">Snapshots folder</div><div class="detail-value" id="snapshots-folder">Loading...</div>
            <div class="detail-label">Scan status</div><div class="detail-value" id="scan-status">Checking...</div>
        </section>
        <div class="config-action"><a class="button" href="/configuration.html">Edit configuration <span aria-hidden="true">&#8599;</span></a></div>
        <section class="scan" aria-label="Start scan">
            <div class="field"><label for="snapshot-name" title="Optional custom name for this scan snapshot. Defaults to date and time if empty">Snapshot name <span style="font-weight:400">(optional, defaults to date and time)</span></label><input id="snapshot-name" maxlength="120" placeholder="For example: Initial scan"></div>
            <button class="button" id="start-scan" type="button" title="Initiate a new inventory scan of all pool volumes">Start scan <span aria-hidden="true">&#8599;</span></button>
        </section>
        <div class="notice" id="notice" role="status" aria-live="polite"></div>

        <section class="planning" aria-labelledby="planning-heading">
            <div class="planning-head">
                <div><h2 id="planning-heading">Placement planning</h2><div class="planning-note">Preview only. No files are moved.</div></div>
            </div>
            <div class="plan-controls">
                <div class="field"><label for="snapshot-select" title="Select an existing pool inventory snapshot to simulate balancing placement">Snapshot</label><select id="snapshot-select"><option value="">Loading snapshots...</option></select></div>
                <button class="button" id="generate-plan" type="button" title="Simulate file placement balancing rules against the selected snapshot">Generate plan</button>
            </div>
            <div class="notice" id="plan-notice" role="status" aria-live="polite"></div>
            <div class="plan-results" id="plan-results"></div>
        </section>
    </main>
    <script>
        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[character]);
        const formatBytes = bytes => {
            if (!bytes) return '0 B';
            const units = ['B','KiB','MiB','GiB','TiB'];
            const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            return `${(bytes / (1024 ** index)).toFixed(index > 1 ? 1 : 0)} ${units[index]}`;
        };

        let activePlan = null;
        let activeVolumeColors = new Map();

        let placementSortCol = 'path';
        let placementSortDesc = false;

        async function loadOverview() {
            const notice = document.getElementById('notice');
            try {
                const [configResponse, statusResponse] = await Promise.all([fetch('/api/config'), fetch('/api/scan/status')]);
                if (!configResponse.ok || !statusResponse.ok) throw new Error('Could not load pool state.');
                const config = await configResponse.json();
                const status = await statusResponse.json();
                const disks = config.disks || [];
                const volumeCount = disks.reduce((total, disk) => total + (disk.volumes?.length || 0), 0);
                document.getElementById('disk-count').textContent = disks.length;
                document.getElementById('volume-count').textContent = volumeCount;
                document.getElementById('pool-mode').textContent = config.drivePoolMode ? 'DrivePool' : 'Standard';
                document.getElementById('disk-names').innerHTML = disks.length
                    ? disks.map(disk => `<span class="disk-name">${escapeHtml(disk.hardwareName)}</span>`).join('')
                    : '<span>No disks configured</span>';
                document.getElementById('snapshots-folder').textContent = config.snapshotsFolder || 'Not configured';
                document.getElementById('scan-status').innerHTML = status.isScanning
                    ? '<span class="activity"><span class="dot"></span>Scan in progress <a class="config-link" href="/scan.html">View progress</a></span>'
                    : (status.scannedAt ? `Last snapshot: ${escapeHtml(status.snapshotName || 'Unnamed')} · ${new Date(status.scannedAt).toLocaleString()}` : 'No completed scans');
                document.getElementById('last-scan').textContent = status.scannedAt ? `Last scan ${new Date(status.scannedAt).toLocaleString()}` : 'No scans completed';
                if (status.error) notice.textContent = `Last scan error: ${status.error}`;
            } catch (error) {
                notice.textContent = error.message;
                notice.classList.add('error');
            }
        }

        async function loadSnapshots() {
            const select = document.getElementById('snapshot-select');
            try {
                const response = await fetch('/api/snapshots');
                const snapshots = await response.json();
                if (!response.ok) throw new Error(snapshots.error || 'Could not load snapshots.');
                select.innerHTML = snapshots.length
                    ? snapshots.map(snapshot => `<option value="${escapeHtml(snapshot.name)}">${escapeHtml(snapshot.name)} · ${new Date(snapshot.lastModifiedUtc).toLocaleString()}</option>`).join('')
                    : '<option value="">No snapshots found</option>';
            } catch (error) {
                select.innerHTML = '<option value="">Could not load snapshots</option>';
                document.getElementById('plan-notice').textContent = error.message;
                document.getElementById('plan-notice').classList.add('error');
            }
        }

        function sortPlacements(placements) {
            return [...placements].sort((a, b) => {
                let valA, valB;
                switch(placementSortCol) {
                    case 'order': valA = a.order; valB = b.order; break;
                    case 'path': valA = a.relativePath.toLowerCase(); valB = b.relativePath.toLowerCase(); break;
                    case 'logic': valA = a.logicApplied.toLowerCase(); valB = b.logicApplied.toLowerCase(); break;
                    case 'target': valA = a.targets.length > 0 ? a.targets[0].alias : ''; valB = b.targets.length > 0 ? b.targets[0].alias : ''; break;
                    case 'size': valA = a.sizeOnDisk; valB = b.sizeOnDisk; break;
                    case 'moved': valA = a.sizeMoved; valB = b.sizeMoved; break;
                }

                let cmp = 0;
                if (valA < valB) cmp = -1;
                else if (valA > valB) cmp = 1;

                if (cmp === 0) {
                    const pathA = a.relativePath.toLowerCase();
                    const pathB = b.relativePath.toLowerCase();
                    if (pathA < pathB) return -1;
                    if (pathA > pathB) return 1;
                    return 0;
                }
                return placementSortDesc ? -cmp : cmp;
            });
        }

        function renderPlacementTable() {
            const tbody = document.getElementById('placement-tbody');
            if (!tbody || !activePlan) return;

            const showStayedIntact = document.getElementById('show-stayed-intact')?.checked || false;
            let filtered = activePlan.placements || [];
            if (!showStayedIntact) {
                filtered = filtered.filter(p => p.logicApplied !== 'Stayed intact');
            }

            const sorted = sortPlacements(filtered);

            // Always show the TOTAL number of placements in the header, regardless of filter.
            const summaryEl = document.getElementById('placements-summary-title');
            if (summaryEl) summaryEl.textContent = `Placements (${activePlan.placements.length})`;

            if (sorted.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="plan-muted">${showStayedIntact ? 'No rules applied.' : 'No placements to show. (Try checking "Show Stayed intact")'}</td></tr>`;
                return;
            }

            tbody.innerHTML = sorted.map(item => {
                const isMoved = item.sizeMoved > 0;
                let targetUi = '';

                if (item.targets.length === 0) {
                     targetUi = '<span class="plan-muted">-</span>';
                } else if (item.logicApplied === 'Split' || item.targets.length > 1) {
                     const targetAlias = escapeHtml(item.targets[0].alias);
                     const targetColor = activeVolumeColors.get(item.targets[0].volumeId) || '#89958f';
                     const segments = item.targets.map(t => {
                         const pct = (t.size / item.sizeOnDisk) * 100;
                         return `<span class="provenance-segment" style="width:${pct}%; background:${activeVolumeColors.get(t.volumeId) || '#89958f'}" title="${escapeHtml(t.alias)}"></span>`;
                     }).join('');
                     targetUi = `<div style="display:flex; flex-direction:column; gap:4px;">
                                   <span class="target-col"><i class="transfer-swatch" style="--source-color:${targetColor}"></i>${targetAlias}</span>
                                   <div class="provenance-bar" style="height:6px; margin:0; width:100px; padding:0; background:#e9eee3; border-radius:3px; display:flex; overflow:hidden;">${segments}</div>
                                 </div>`;
                } else {
                     const t = item.targets[0];
                     const c = activeVolumeColors.get(t.volumeId) || '#89958f';
                     targetUi = `<span class="target-col"><i class="transfer-swatch" style="--source-color:${c}"></i>${escapeHtml(t.alias)}</span>`;
                }

                let miniBar = '<span class="plan-muted">-</span>';
                if (isMoved) {
                     const pct = ((item.sizeMoved / item.sizeOnDisk) * 100).toFixed(1);
                     const movedText = `${formatBytes(item.sizeMoved)} <span class="plan-muted">(${pct}%)</span>`;
                     const segments = item.sources.map(src => {
                         const pctSrc = (src.size / item.sizeMoved) * 100;
                         const tooltip = `${formatBytes(src.size)} moving from ${escapeHtml(src.alias)}`;
                         return `<span class="provenance-segment" style="width:${pctSrc}%; background:${activeVolumeColors.get(src.volumeId) || '#89958f'}" title="${tooltip}"></span>`;
                     }).join('');
                     miniBar = `<div style="display:flex; flex-direction:column; gap:4px;">
                                   <span>${movedText}</span>
                                   <div class="provenance-bar" style="height:6px; margin:0; width:100px; padding:0; background:#e9eee3; border-radius:3px; display:flex; overflow:hidden;">${segments}</div>
                                </div>`;
                }

                // Catch-all chunks (e.g. 999998, 999999) display as a dash
                const isSpecial = item.order >= 999900;
                const orderText = isSpecial ? '-' : item.order;
                const orderTitle = isSpecial ? 'Deferred or unassigned catch-all category' : `Evaluated at rule decision order #${item.order}`;

                let pathTitle = `Pool folder: ${item.relativePath}`;
                if (item.relativePath === '** Duplicate') {
                    pathTitle = 'Duplicate copies of files (such as DrivePool mirrored copies or extra replicas). Preserved in place or balanced onto emptiest volumes.';
                } else if (item.relativePath === '** Unmatched') {
                    pathTitle = 'Files and folders that did not match any placement rule. Remain on current volume if space permits, or placed on emptiest volumes.';
                } else if (item.relativePath.includes('[duplicate]')) {
                    pathTitle = `Duplicate copy of folder: ${item.relativePath}`;
                } else if (item.relativePath.startsWith('<Pool Root>')) {
                    pathTitle = 'Loose files and folders residing directly at the root of the storage pool.';
                }

                const logicDescriptions = {
                    'Stayed intact': 'All files already reside on allowed target volumes and require no file movement.',
                    'Moved': 'All files under this path are assigned to move from their source volume to a target volume.',
                    'Split': 'Files under this path are distributed across multiple allowed target volumes based on depth and available capacity.',
                    'Consolidated': 'Files dispersed across multiple volumes are gathered onto the primary volume where the majority already resided.',
                    'Moved/Consolidated': 'Files dispersed across multiple volumes are gathered onto a new single target volume.'
                };
                const logicTitle = logicDescriptions[item.logicApplied] || item.logicApplied;

                return `<tr>
                    <td style="font-variant-numeric:tabular-nums; color:var(--muted);" title="${escapeHtml(orderTitle)}">${orderText}</td>
                    <td class="plan-path" title="${escapeHtml(pathTitle)}">${escapeHtml(item.relativePath)}</td>
                    <td><span class="reason-badge" title="${escapeHtml(logicTitle)}">${escapeHtml(item.logicApplied)}</span></td>
                    <td>${targetUi}</td>
                    <td style="font-variant-numeric:tabular-nums" title="Total data size on disk: ${formatBytes(item.sizeOnDisk)}">${formatBytes(item.sizeOnDisk)}</td>
                    <td style="font-variant-numeric:tabular-nums" title="${isMoved ? `${formatBytes(item.sizeMoved)} moved between volumes` : 'No movement required'}">${miniBar}</td>
                </tr>`;
            }).join('');

            document.querySelectorAll('th[data-sort]').forEach(th => {
                const sortKey = th.dataset.sort;
                th.innerHTML = th.innerHTML.replace(/ ▾| ▴/g, '');
                if (placementSortCol === sortKey) {
                    th.innerHTML += placementSortDesc ? ' ▾' : ' ▴';
                }
            });
        }

        function renderPlan(plan) {
            activePlan = plan;
            const volumes = plan.volumes || [];
            activeVolumeColors = new Map(volumes.map((volume, index) => [volume.volumeId, `hsl(${Math.round((index * 137.508 + 145) % 360)} 58% 42%)`]));

            const totalMovedBytes = (plan.placements || []).reduce((acc, p) => acc + (p.sizeMoved || 0), 0);

            const warningMarkup = (plan.warnings || []).map(warning => `<div class="plan-warning">${escapeHtml(warning.message)}</div>`).join('');

            const volumeCards = [...volumes].sort((a, b) => a.alias.localeCompare(b.alias, undefined, {numeric: true})).map(volume => {
                const color = activeVolumeColors.get(volume.volumeId);
                const provenance = volume.provenance || [];
                const segments = provenance.map(item => {
                    const sourceColor = activeVolumeColors.get(item.volumeId) || '#89958f';
                    const percentage = volume.finalSize > 0 ? item.size * 100 / volume.finalSize : 0;
                    return `<span class="provenance-segment" style="width:${percentage}%;background:${sourceColor}" title="${escapeHtml(item.alias)} · ${percentage.toFixed(1)}% · ${formatBytes(item.size)}"></span>`;
                }).join('');
                const legend = provenance.map(item => {
                    const sourceColor = activeVolumeColors.get(item.volumeId) || '#89958f';
                    const percentage = volume.finalSize > 0 ? item.size * 100 / volume.finalSize : 0;
                    return `<span class="provenance-key"><i class="provenance-swatch" style="--source-color:${sourceColor}"></i>${escapeHtml(item.alias)} ${percentage.toFixed(0)}%</span>`;
                }).join('');
                return `<div class="volume-card" data-volume-id="${escapeHtml(volume.volumeId)}" style="--volume-color:${color}" title="Volume ${escapeHtml(volume.alias)}: ${formatBytes(volume.finalSize)} projected usage of ${formatBytes(volume.capacity)} capacity">
                    <div class="volume-card-head"><div><div class="volume-alias">${escapeHtml(volume.alias)}</div></div><div class="volume-size"><strong>${formatBytes(volume.finalSize)}</strong><div class="plan-muted">of ${formatBytes(volume.capacity)}</div></div></div>
                    <div class="provenance-bar" aria-label="Content provenance">${segments}</div>
                    <div class="provenance-legend">${legend || '<span class="plan-muted">No planned content</span>'}</div>
                    ${volume.isEligible ? '' : `<div class="volume-state">${escapeHtml(volume.status)}</div>`}
                </div>`;
            }).join('');

            document.getElementById('plan-results').innerHTML = `
                <div class="plan-counts">
                    <span><strong>${formatBytes(totalMovedBytes)}</strong> to transfer</span>
                    <span>Snapshot ${new Date(plan.snapshotScannedAt).toLocaleString()}</span>
                </div>
                ${warningMarkup}

                <details class="plan-group" open style="margin-bottom: 24px; margin-top: 14px; border-top: 1px solid var(--line);">
                    <summary id="placements-summary-title">Placements (${plan.placements.length})</summary>

                    <div class="plan-filters" style="margin: 4px 0 12px 0;">
                        <label style="font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;" title="Toggle visibility of paths where all files already reside on target volumes and require no file movement">
                            <input type="checkbox" id="show-stayed-intact"> Show 'Stayed intact' placements
                        </label>
                    </div>

                    <div class="table-scroll">
                        <table class="plan-table">
                            <thead>
                                <tr>
                                    <th data-sort="order" style="cursor:pointer" title="Rule evaluation order. Lower numbers run first; '-' denotes unplaced, duplicate, or catch-all files. Click to sort.">#</th>
                                    <th data-sort="path" style="cursor:pointer" title="Relative pool folder path or category. Special categories include ** Duplicate, ** Unmatched, and <Pool Root>. Click to sort.">Path</th>
                                    <th data-sort="logic" style="cursor:pointer" title="Placement strategy applied: Stayed intact, Moved, Split, Consolidated, or Moved/Consolidated. Click to sort.">Logic applied</th>
                                    <th data-sort="target" style="cursor:pointer" title="Destination volume(s) assigned to store files for this path. Click to sort.">Target volume</th>
                                    <th data-sort="size" style="cursor:pointer" title="Total size on disk of all files under this path. Click to sort.">Total Size</th>
                                    <th data-sort="moved" style="cursor:pointer" title="Amount of data that must be transferred between physical volumes to satisfy placement rules. Click to sort.">Size Moved</th>
                                </tr>
                            </thead>
                            <tbody id="placement-tbody"></tbody>
                        </table>
                    </div>
                </details>

                <h3 style="margin: 0 0 12px; font-size: 16px;">Volume utilization</h3>
                <div class="volume-grid" id="volume-grid">${volumeCards || '<div class="empty">No usable volumes in this snapshot.</div>'}</div>
                `;

            renderPlacementTable();

            document.getElementById('show-stayed-intact').addEventListener('change', renderPlacementTable);

            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', () => {
                    const sortKey = th.dataset.sort;
                    if (placementSortCol === sortKey) {
                        placementSortDesc = !placementSortDesc;
                    } else {
                        placementSortCol = sortKey;
                        placementSortDesc = false;
                    }
                    renderPlacementTable();
                });
            });
        }

        async function generatePlan() {
            const snapshotName = document.getElementById('snapshot-select').value;
            const notice = document.getElementById('plan-notice');
            const button = document.getElementById('generate-plan');
            if (!snapshotName) {
                notice.textContent = 'Choose a snapshot first.';
                notice.classList.add('error');
                return;
            }

            button.disabled = true;
            notice.textContent = 'Generating preview...';
            notice.classList.remove('error');
            try {
                const response = await fetch('/api/plan', {
                    method:'POST',
                    headers:{ 'Content-Type':'application/json' },
                    body:JSON.stringify({ snapshotName })
                });
                const plan = await response.json();
                if (!response.ok) throw new Error(plan.error || 'Could not generate a plan.');
                renderPlan(plan);
                notice.textContent = '';
            } catch (error) {
                notice.textContent = error.message;
                notice.classList.add('error');
            } finally {
                button.disabled = false;
            }
        }

        document.getElementById('start-scan').addEventListener('click', () => {
            const name = document.getElementById('snapshot-name').value.trim();
            const query = new URLSearchParams({ start:'1' });
            if (name) query.set('name', name);
            const url = `/scan.html?${query}`;
            const scanPage = window.open(url, '_blank');
            if (!scanPage) window.location.assign(url);
        });
        document.getElementById('generate-plan').addEventListener('click', generatePlan);

        loadOverview();
        loadSnapshots();
    </script>
</body>
</html>
