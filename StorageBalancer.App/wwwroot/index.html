<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Storage Pool Balancer</title>
    <link rel="stylesheet" href="/shared.css">
    <style>
        .hero-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .hero-title p {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }
        .hero-actions {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .step-container {
            margin-bottom: 20px;
        }
        .step-placeholder {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header class="shell">
        <a href="/" class="brand">
            <span class="brand-icon">S</span>
            Storage Pool Balancer
        </a>
    </header>

    <main class="shell">
        <!-- Top Action & Title Area -->
        <div class="hero-bar">
            <div class="hero-title">
                <p>Run automated end-to-end pool balancing: Scan volumes, plan placements, and execute the balancing plan.</p>
            </div>
            <div class="hero-actions">
                <div style="display:flex; align-items:center; gap:6px;">
                    <label for="test-max-files" style="font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap;" title="Temporary test limit: throw an exception after copying this number of files">Number of files to copy:</label>
                    <input type="number" id="test-max-files" min="1" placeholder="All" style="width:70px; padding:6px 8px; border:1px solid var(--line); border-radius:5px; background:var(--surface); font-size:13px;" title="Test option: limits how many files are copied before throwing an exception">
                </div>
                <a href="/configuration.html" class="btn" title="Open and edit pool volumes, paths, and placement rules">
                    ⚙️ Edit Configuration
                </a>
                <button class="btn danger" id="btn-cancel-process" style="display:none;" title="Cancel running process">
                    Cancel Process
                </button>
                <button class="btn primary btn-large" id="btn-start-process" title="Start scanning, planning, and executing file balancing">
                    ▶ Start Process
                </button>
            </div>
        </div>

        <!-- 3-Step Pipeline Indicator -->
        <div class="stepper">
            <div class="step-card" id="step-card-1">
                <div class="step-num" id="step-badge-1">1</div>
                <div class="step-info">
                    <div class="step-title">State Scan</div>
                    <div class="step-desc" id="step-desc-1">Ready</div>
                </div>
            </div>
            <div class="step-card" id="step-card-2">
                <div class="step-num" id="step-badge-2">2</div>
                <div class="step-info">
                    <div class="step-title">Placement Planning</div>
                    <div class="step-desc" id="step-desc-2">Waiting</div>
                </div>
            </div>
            <div class="step-card" id="step-card-3">
                <div class="step-num" id="step-badge-3">3</div>
                <div class="step-info">
                    <div class="step-title">Plan Execution</div>
                    <div class="step-desc" id="step-desc-3">Waiting</div>
                </div>
            </div>
        </div>

        <div id="main-notice" class="notice"></div>

        <!-- PIPELINE PROCESS SECTIONS -->
        <div id="section-scan"></div>
        <div id="section-plan"></div>
        <div id="section-exec"></div>
    </main>

    <script src="/shared-scanner.js"></script>
    <script src="/shared-planner.js"></script>
    <script src="/shared-executer.js"></script>
    <script>
        Balancer.scanner.renderSection('section-scan', {
            titleText: '🔍 Step 1: State Scan',
            subtitleText: 'Not started',
            containerClass: 'step-container',
            open: false,
            placeholderClass: 'step-placeholder',
            placeholderText: "Click 'Start Process' to begin scanning pool volumes."
        });

        Balancer.plan.renderSection('section-plan', {
            titleText: '📊 Step 2: Placement Planning',
            subtitleText: 'Waiting for scan',
            containerClass: 'step-container',
            open: false,
            placeholderClass: 'step-placeholder',
            placeholderText: 'Placement preview will generate automatically after the scan completes.'
        });

        Balancer.execution.renderSection('section-exec', {
            titleText: '⚡ Step 3: Plan Execution',
            subtitleText: 'Waiting for plan',
            containerClass: 'step-container',
            open: false,
            placeholderClass: 'step-placeholder',
            placeholderText: 'Execution will begin automatically after the placement plan is generated.'
        });

        const btnStart = document.getElementById('btn-start-process');
        const btnCancel = document.getElementById('btn-cancel-process');
        const snapshotSelect = document.getElementById('snapshot-select');
        const scanTbody = document.getElementById('scan-tbody');
        const scanSubtitle = document.getElementById('scan-subtitle');
        const planSubtitle = document.getElementById('plan-subtitle');
        const planResults = document.getElementById('plan-results');
        const execSubtitle = document.getElementById('exec-subtitle');
        const execTbody = document.getElementById('exec-tbody');
        const execSummaryBar = document.getElementById('exec-summary-bar');
        const execPct = document.getElementById('exec-pct');
        const execTransferred = document.getElementById('exec-transferred');
        const execFiles = document.getElementById('exec-files');
        const execSpeed = document.getElementById('exec-speed');
        const execProgressFill = document.getElementById('exec-progress-fill');
        const mainNotice = document.getElementById('main-notice');

        let appState = {
            config: null,
            isRunning: false,
            currentStep: 0,
            activeRunner: null,
            pollTimer: null,
            activeSnapshotName: null
        };

        function showNotice(msg, type = 'info') {
            mainNotice.textContent = msg;
            mainNotice.className = `notice ${type}`;
        }

        function clearNotice() {
            mainNotice.textContent = '';
            mainNotice.className = 'notice';
        }

        function setStepState(stepNum, status, descText) {
            const card = document.getElementById(`step-card-${stepNum}`);
            const badge = document.getElementById(`step-badge-${stepNum}`);
            const desc = document.getElementById(`step-desc-${stepNum}`);

            card.classList.remove('active', 'completed');
            if (descText) desc.textContent = descText;

            if (status === 'active') {
                card.classList.add('active');
                badge.innerHTML = `<span class="spinner" style="width:12px; height:12px;"></span>`;
            } else if (status === 'completed') {
                card.classList.add('completed');
                badge.innerHTML = '✓';
            } else {
                badge.textContent = stepNum;
            }
        }

        async function initPage() {
            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    appState.config = await res.json();
                }
            } catch (e) {}

            // Check if scan is currently running on server
            try {
                const status = await Balancer.scan.fetchStatus();
                if (status.isScanning) {
                    appState.isRunning = true;
                    btnStart.disabled = true;
                    btnStart.style.display = 'none';
                    btnCancel.style.display = 'inline-flex';
                    btnCancel.disabled = false;
                    setStepState(1, 'active', 'Scanning...');
                    appState.activeSnapshotName = status.snapshotName;
                    pollScanUntilComplete().then(onScanFinishedAfterReattach).catch(err => showNotice(err.message, 'error'));
                    return;
                }
            } catch (e) {}

            // Check if real execution is currently running on server
            try {
                const execStatus = await Balancer.execution.fetchStatus();
                if (execStatus.isRunning && !execStatus.isSimulation) {
                    appState.isRunning = true;
                    btnStart.disabled = true;
                    btnStart.style.display = 'none';
                    btnCancel.style.display = 'inline-flex';
                    btnCancel.disabled = false;
                    setStepState(1, 'completed', 'Completed');
                    setStepState(2, 'completed', 'Completed');
                    setStepState(3, 'active', 'Transferring...');
                    document.getElementById('details-exec').open = true;
                    execSummaryBar.style.display = 'flex';
                    runExecution(appState.activeSnapshotName, null);
                    return;
                }
            } catch (e) {}
        }

        async function onScanFinishedAfterReattach(status) {
            if (!appState.isRunning) return;
            setStepState(1, 'completed', 'Completed');
            // Continue with Planning
            await runPlanningAndExecution(status.snapshotName || appState.activeSnapshotName);
        }

        async function startProcess() {
            if (appState.isRunning) return;
            appState.isRunning = true;
            clearNotice();

            btnStart.disabled = true;
            btnStart.style.display = 'none';
            btnCancel.style.display = 'inline-flex';
            btnCancel.disabled = false;
            const maxFilesInput = document.getElementById('test-max-files');
            if (maxFilesInput) maxFilesInput.disabled = true;

            // Full end-to-end run: Live Scan first
            const now = new Date();
            const snapPad = n => String(n).padStart(2, '0');
            const snapName = `Balancing_${now.getFullYear()}-${snapPad(now.getMonth() + 1)}-${snapPad(now.getDate())}_${snapPad(now.getHours())}-${snapPad(now.getMinutes())}-${snapPad(now.getSeconds())}`;
            appState.activeSnapshotName = snapName;

            setStepState(1, 'active', 'Scanning...');
            setStepState(2, 'pending', 'Waiting for scan');
            setStepState(3, 'pending', 'Waiting for plan');
            document.getElementById('details-scan').open = true;
            const scanDetailsVolumes = document.getElementById('scan-details-volumes');
            if (scanDetailsVolumes) scanDetailsVolumes.open = true;

            try {
                appState.currentStep = 1;
                scanSubtitle.textContent = 'Scanning volumes in progress...';
                await Balancer.scan.startScan(snapName);
                await pollScanUntilComplete();

                if (!appState.isRunning) return;
                setStepState(1, 'completed', 'Completed');

                await runPlanningAndExecution(snapName);
            } catch (err) {
                showNotice(err.message || 'Scan encountered an error.', 'error');
                setStepState(1, 'pending', 'Failed');
                stopProcessUI();
            }
        }

        async function runPlanningAndExecution(snapshotName) {
            try {
                // STEP 2: PLACEMENT PLANNING
                appState.currentStep = 2;
                setStepState(2, 'active', 'Simulating...');
                document.getElementById('details-plan').open = true;
                planSubtitle.textContent = 'Simulating placement rules...';
                planResults.innerHTML = '<div style="padding:20px; text-align:center;"><span class="spinner"></span> Simulating placement rules and file balancing...</div>';

                const plan = await Balancer.plan.generatePlan(snapshotName, false);
                Balancer.plan.renderPlan(plan, planResults, { sectionsOpenByDefault: false });
                planSubtitle.textContent = `Generated: ${new Date().toLocaleTimeString()}`;
                setStepState(2, 'completed', 'Completed');

                if (!appState.isRunning) return;

                // STEP 3: EXECUTION
                appState.currentStep = 3;
                setStepState(3, 'active', 'Transferring...');
                document.getElementById('details-exec').open = true;
                execSubtitle.textContent = 'Executing file balancing plan...';
                execSummaryBar.style.display = 'flex';

                await runExecution(snapshotName, plan);

                setStepState(3, 'completed', 'Completed');
                execSubtitle.textContent = 'Finished';
                showNotice('Process completed successfully! File balancing and empty folder cleanup executed.', 'success');
            } catch (err) {
                showNotice(err.message || 'Process encountered an error.', 'error');
                if (appState.currentStep === 2) setStepState(2, 'pending', 'Failed');
                if (appState.currentStep === 3) setStepState(3, 'pending', 'Failed');
            } finally {
                stopProcessUI();
            }
        }

        function pollScanUntilComplete() {
            return new Promise((resolve, reject) => {
                async function check() {
                    if (!appState.isRunning) return resolve();
                    try {
                        const status = await Balancer.scan.fetchStatus();
                        Balancer.scan.renderTable(status, scanTbody, appState.config?.volumes);

                        if (status.isScanning) {
                            appState.pollTimer = setTimeout(check, 800);
                        } else {
                            const detailsVol = document.getElementById('scan-details-volumes');
                            if (detailsVol) detailsVol.open = false;

                            if (status.error) {
                                reject(new Error(`Scan failed: ${status.error}`));
                            } else {
                                scanSubtitle.textContent = `Scan finished at ${new Date(status.scannedAt || Date.now()).toLocaleTimeString()}`;
                                resolve(status);
                            }
                        }
                    } catch (err) {
                        reject(err);
                    }
                }
                check();
            });
        }

        function runExecution(snapshotName, plan) {
            const volumeColors = Balancer.getVolumeColorMap(plan?.volumes || appState.config?.volumes || []);
            appState.volumeColors = volumeColors;

            execSubtitle.innerHTML = '<span class="spinner" style="width:12px; height:12px; margin-right:6px;"></span> Preparing execution... (Computing placement plan)';
            execSummaryBar.style.display = 'flex';
            execPct.textContent = 'Preparing...';
            execTransferred.textContent = 'Analyzing...';
            execFiles.textContent = 'Analyzing...';
            execSpeed.textContent = '0 MB/s';
            execProgressFill.style.width = '0%';
            execTbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center; padding:32px 16px; color:var(--deep); background:#eaf2ed; border-radius:6px;">
                        <div style="display:flex; align-items:center; justify-content:center; gap:10px; font-size:14px; font-weight:700;">
                            <span class="spinner" style="width:16px; height:16px;"></span>
                            <span>Preparing execution... Computing file placements and transfer queues...</span>
                        </div>
                        <div style="font-size:12px; color:var(--muted); margin-top:6px;">
                            Analyzing pool structure and balancing rules across volumes. Moves will begin in a few moments.
                        </div>
                    </td>
                </tr>`;

            const execFoldersCleaned = document.getElementById('exec-folders-cleaned');
            if (execFoldersCleaned) execFoldersCleaned.textContent = '-';

            return new Promise(async (resolve, reject) => {
                const maxFilesVal = document.getElementById('test-max-files')?.value;
                const maxFilesToCopy = maxFilesVal ? parseInt(maxFilesVal, 10) : null;

                try {
                    await Balancer.execution.start({
                        snapshotName,
                        isSimulation: false,
                        maxFilesToCopy
                    });
                } catch (startErr) {
                    return reject(startErr);
                }

                async function pollStatus() {
                    if (!appState.isRunning) return resolve();

                    try {
                        const status = await Balancer.execution.fetchStatus();

                        Balancer.execution.renderStatusSummary(status, {
                            subtitle: execSubtitle,
                            pct: execPct,
                            progressFill: execProgressFill,
                            transferred: execTransferred,
                            files: execFiles,
                            speed: execSpeed,
                            foldersCleaned: execFoldersCleaned,
                            summaryBar: execSummaryBar
                        });

                        Balancer.execution.renderTable(status, execTbody, volumeColors);

                        if (status.isRunning) {
                            appState.pollTimer = setTimeout(pollStatus, 1000);
                        } else {
                            if (status.error) {
                                reject(new Error(`Execution failed: ${status.error}`));
                            } else {
                                resolve();
                            }
                        }
                    } catch (pollErr) {
                        reject(pollErr);
                    }
                }

                pollStatus();
            });
        }

        async function cancelCurrentProcess() {
            if (!appState.isRunning) return;
            btnCancel.disabled = true;
            btnCancel.textContent = 'Cancelling...';

            if (appState.currentStep === 1) {
                try { await Balancer.scan.cancelScan(); } catch (e) {}
            }
            if (appState.currentStep === 3) {
                try { await Balancer.execution.cancel(); } catch (e) {}
            }

            if (appState.pollTimer) clearTimeout(appState.pollTimer);
            appState.isRunning = false;
            showNotice('Process was cancelled by the user.', 'error');
            stopProcessUI();
        }

        function stopProcessUI() {
            appState.isRunning = false;
            if (appState.pollTimer) clearTimeout(appState.pollTimer);
            btnStart.disabled = false;
            btnStart.style.display = 'inline-flex';
            btnCancel.style.display = 'none';
            btnCancel.disabled = false;
            btnCancel.textContent = 'Cancel Process';
            const maxFilesInput = document.getElementById('test-max-files');
            if (maxFilesInput) maxFilesInput.disabled = false;
        }

        btnStart.addEventListener('click', startProcess);
        btnCancel.addEventListener('click', cancelCurrentProcess);

        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
